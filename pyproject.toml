[project]
name = "portfolio-analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.2", "pandas>=2.2", "scipy>=1.15", "pyarrow>=19", "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
publication = ["matplotlib==3.11.2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src", "."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
